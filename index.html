<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shringaar</title>
    <!-- The brandmark, inline: one fewer request than a favicon file, and no 404 in the console. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f9f5ee'/%3E%3Cpath d='M16 5.5 23.5 13 16 26.5 8.5 13Z' fill='%23b08d57'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Shringaar seller dashboard — manage your jewellery catalogue, storefront and AR try-on assets."
    />
    <meta name="theme-color" content="#2F4436" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter Tight, one family for the whole app. Loaded with the optical-size-free
         static cuts at the four weights the design uses: 300 (giant figures),
         400 (display and body), 500 (labels) and 600 (buttons and active nav). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
